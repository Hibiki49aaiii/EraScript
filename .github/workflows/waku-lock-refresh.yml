name: Refresh Live Waku Lockfile

on:
  push:
    branches: [main]
    paths:
      - "test/live/waku-deps/package.json"
      - ".github/workflows/waku-lock-refresh.yml"

permissions:
  contents: write

concurrency:
  group: erascript-live-waku-lock-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fast-forward to current main
        run: git pull --ff-only origin main
      - name: Generate isolated Waku lockfile
        run: npm install --package-lock-only --ignore-scripts --prefix test/live/waku-deps
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/live/waku-deps/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: lock live-only Waku dependency graph"
          git push
