name: Dependency Production Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dependency-audit-capture.yml"

permissions:
  contents: read

jobs:
  audit-production:
    name: Audit production dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production dependency audit has no high/critical finding
        run: npm audit --omit=dev --audit-level=high
