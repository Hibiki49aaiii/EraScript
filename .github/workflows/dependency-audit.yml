name: Dependency Audit

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 4 * * 1"

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-gate:
    name: Production high/critical gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate locked production install
        run: npm ci --omit=dev --ignore-scripts
      - name: Fail on production high/critical advisories
        run: npm audit --omit=dev --audit-level=high

  root-dev-evidence:
    name: Root dev/test audit evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Capture root dev/test audit JSON
        shell: bash
        run: |
          npm run audit:evidence -- root-dev-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: root-dev-audit
          path: root-dev-audit.json
          if-no-files-found: error
          retention-days: 14

  waku-evidence:
    name: Isolated Waku audit evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate isolated locked install without scripts
        run: npm ci --prefix test/live/waku-deps --ignore-scripts
      - name: Capture isolated Waku audit JSON
        shell: bash
        run: |
          npm run audit:evidence -- waku-audit.json test/live/waku-deps
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-waku-audit
          path: waku-audit.json
          if-no-files-found: error
          retention-days: 14
