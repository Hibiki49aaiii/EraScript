name: Live Network Integration

# v0.6 completion smoke: read-only network evidence; never broadcasts transactions.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "test/live/**"
      - ".github/workflows/live-integration.yml"
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: live-network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-readonly:
    name: Live / public-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOLANA_RPC_URL: ${{ vars.SOLANA_RPC_URL }}
      SUI_GRPC_URL: ${{ vars.SUI_GRPC_URL }}
      JITO_BLOCK_ENGINE_URL: ${{ vars.JITO_BLOCK_ENGINE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: node --test dist/test/live/solana-rpc.test.js
      - run: node --test dist/test/live/sui-core.test.js
      - run: node --test dist/test/live/jito.test.js

  railgun-waku:
    name: Live / railgun-waku
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILGUN_TRUSTED_FEE_SIGNER: ${{ vars.RAILGUN_TRUSTED_FEE_SIGNER }}
      RAILGUN_WAKU_DISCOVERY_TIMEOUT_MS: "90000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install --no-save @railgun-community/waku-broadcaster-client-node@9.1.1
      - run: npm run build
      - run: node dist/test/live/railgun-waku.live.js
