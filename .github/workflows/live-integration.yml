name: Live Network Integration

permissions:
  contents: read

# v0.6 completion smoke: read-only network evidence; never broadcasts transactions.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "test/live/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/live-integration.yml"
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: live-network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-readonly:
    name: Live / public-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOLANA_RPC_URL: ${{ vars.SOLANA_RPC_URL }}
      SUI_GRPC_URL: ${{ vars.SUI_GRPC_URL }}
      JITO_BLOCK_ENGINE_URL: ${{ vars.JITO_BLOCK_ENGINE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --test dist/test/live/solana-rpc.test.js
      - run: node --test dist/test/live/sui-core.test.js
      - run: node --test dist/test/live/jito.test.js

  railgun-waku:
    name: Live / railgun-waku
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILGUN_TRUSTED_FEE_SIGNER: ${{ vars.RAILGUN_TRUSTED_FEE_SIGNER }}
      RAILGUN_WAKU_DISCOVERY_TIMEOUT_MS: "90000"
      RAILGUN_WAKU_DEPS_ROOT: ${{ github.workspace }}/test/live/waku-deps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix test/live/waku-deps --ignore-scripts
      - run: npm run build
      - run: node dist/test/live/railgun-waku.live.js
